name: Build VST3 (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target OctaveHavoc_VST3 --parallel 2

      - name: Verify VST3 output
        shell: pwsh
        run: |
          $plugin = "build/OctaveHavoc_artefacts/Release/VST3/Octave Havoc.vst3"
          if (-not (Test-Path $plugin)) {
            Write-Error "Expected VST3 bundle was not produced: $plugin"
            Get-ChildItem -Recurse build/OctaveHavoc_artefacts | Select-Object FullName
            exit 1
          }
          Write-Host "VST3 bundle found: $plugin"

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OctaveHavoc-VST3-Windows
          path: build/OctaveHavoc_artefacts/Release/VST3/Octave Havoc.vst3
          if-no-files-found: error
